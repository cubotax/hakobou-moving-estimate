<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE連携</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .container {
      text-align: center;
      padding: 20px;
    }
    .loading {
      width: 40px;
      height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #00B900;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .message {
      color: #666;
      font-size: 14px;
    }
    .error {
      color: #ff5252;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="loading"></div>
    <p id="message" class="message">処理中...</p>
  </div>

  <script>
    const LIFF_ID = '2008810460-IvjGbCbG';
    
    function showMessage(text, isError) {
      const el = document.getElementById('message');
      el.textContent = text;
      if (isError) el.classList.add('error');
      console.log('[LIFF]', text);
    }
    
    function showDebug(info) {
      console.log('[DEBUG]', JSON.stringify(info, null, 2));
    }
    
    async function main() {
      try {
        showMessage('LIFFを初期化中...');
        showDebug({ step: 'init', liffId: LIFF_ID, url: window.location.href });
        
        await liff.init({ liffId: LIFF_ID });
        showDebug({ step: 'init_done', isLoggedIn: liff.isLoggedIn(), isInClient: liff.isInClient() });
        
        if (!liff.isLoggedIn()) {
          showMessage('LINEログイン中...');
          liff.login({ redirectUri: window.location.href });
          return;
        }
        
        showMessage('プロフィール取得中...');
        const profile = await liff.getProfile();
        const lineUserId = profile.userId;
        showDebug({ step: 'profile', userId: lineUserId, displayName: profile.displayName });
        
        // URLパラメータから見積もりデータを取得
        const urlParams = new URLSearchParams(window.location.search);
        const estimateDataEncoded = urlParams.get('data');
        showDebug({ step: 'params', hasData: !!estimateDataEncoded, dataLength: estimateDataEncoded?.length });
        
        if (!estimateDataEncoded) {
          showMessage('見積もりデータが見つかりません', true);
          showDebug({ step: 'error', reason: 'no_data_param', search: window.location.search });
          return;
        }
        
        let estimate;
        try {
          const decoded = decodeURIComponent(atob(estimateDataEncoded));
          estimate = JSON.parse(decoded);
          showDebug({ step: 'decode', estimate });
        } catch (e) {
          console.error('Parse error:', e);
          showMessage('見積もりデータの解析に失敗しました', true);
          showDebug({ step: 'decode_error', error: e.message, raw: estimateDataEncoded });
          return;
        }
        
        showMessage('見積もりを送信中...');
        const apiUrl = '/api/link';
        showDebug({ step: 'send', apiUrl, lineUserId, estimate });
        
        const res = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lineUserId, estimate })
        });
        
        const resData = await res.json();
        showDebug({ step: 'response', status: res.status, ok: res.ok, data: resData });
        
        if (!res.ok) {
          throw new Error(resData.error || 'サーバーエラー');
        }
        
        showMessage('完了！チャットを開きます...');
        
        setTimeout(() => {
          if (liff.isInClient()) {
            liff.closeWindow();
          } else {
            window.location.href = 'https://line.me/R/oaMessage/@602epmvz/';
          }
        }, 800);
        
      } catch (error) {
        console.error('Error:', error);
        showMessage(error.message || 'エラーが発生しました', true);
        showDebug({ step: 'fatal_error', error: error.message, stack: error.stack });
      }
    }
    
    document.addEventListener('DOMContentLoaded', main);
  </script>
</body>
</html>
