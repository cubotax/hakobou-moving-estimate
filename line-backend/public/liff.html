<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE連携</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .container {
      text-align: center;
      padding: 20px;
    }
    .loading {
      width: 40px;
      height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #00B900;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .message {
      color: #666;
      font-size: 14px;
    }
    .error {
      color: #ff5252;
    }
    .debug {
      margin-top: 16px;
      padding: 12px;
      background: #f0f0f0;
      border-radius: 8px;
      font-size: 11px;
      text-align: left;
      max-width: 300px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="loading" id="spinner"></div>
    <p id="message" class="message">処理中...</p>
    <div id="debug" class="debug" style="display:none;"></div>
  </div>

  <script>
    const LIFF_ID = '2008810460-IvjGbCbG';
    
    function log(step, data = {}) {
      const msg = `[LIFF] ${step}: ${JSON.stringify(data)}`;
      console.log(msg);
      // デバッグ表示（本番では非表示）
      const debugEl = document.getElementById('debug');
      if (debugEl) {
        debugEl.style.display = 'block';
        debugEl.innerHTML += `<div>${step}: ${JSON.stringify(data)}</div>`;
      }
    }
    
    function showMessage(text, isError = false) {
      const el = document.getElementById('message');
      el.textContent = text;
      if (isError) {
        el.classList.add('error');
        document.getElementById('spinner').style.display = 'none';
      }
      log('showMessage', { text, isError });
    }
    
    // estimateIdを取得（URL or liff.state）
    function getEstimateId() {
      const urlParams = new URLSearchParams(window.location.search);
      
      // 1. 通常のクエリパラメータから取得
      let estimateId = urlParams.get('estimateId');
      if (estimateId) {
        log('getEstimateId', { source: 'query', estimateId });
        return estimateId;
      }
      
      // 2. liff.stateから取得（ログイン後リダイレクト時）
      const liffState = urlParams.get('liff.state');
      if (liffState) {
        log('getEstimateId', { source: 'liff.state', raw: liffState });
        try {
          const decoded = decodeURIComponent(liffState);
          // "?estimateId=xxx" or "estimateId=xxx" or "/liff.html?estimateId=xxx" 形式に対応
          const match = decoded.match(/estimateId=([^&]+)/);
          if (match) {
            estimateId = match[1];
            log('getEstimateId', { source: 'liff.state.parsed', estimateId });
            return estimateId;
          }
        } catch (e) {
          log('getEstimateId', { error: 'parse_failed', liffState });
        }
      }
      
      log('getEstimateId', { source: 'none', estimateId: null });
      return null;
    }
    
    async function main() {
      try {
        log('main', { step: 'start', url: window.location.href });
        
        showMessage('LIFFを初期化中...');
        await liff.init({ liffId: LIFF_ID });
        log('main', { step: 'init_done', isLoggedIn: liff.isLoggedIn(), isInClient: liff.isInClient() });
        
        // estimateIdを取得
        const estimateId = getEstimateId();
        log('main', { step: 'estimateId', estimateId });
        
        if (!estimateId) {
          showMessage('見積もりIDが見つかりません', true);
          return;
        }
        
        // ログイン確認
        if (!liff.isLoggedIn()) {
          showMessage('LINEログイン中...');
          log('main', { step: 'login_redirect' });
          // ログイン後にestimateIdを保持するため、現在のURLをそのまま渡す
          liff.login();
          return;
        }
        
        // プロフィール取得
        showMessage('プロフィール取得中...');
        const profile = await liff.getProfile();
        const lineUserId = profile.userId;
        log('main', { step: 'profile', lineUserId, displayName: profile.displayName });
        
        // APIに送信
        showMessage('見積もりを送信中...');
        log('main', { step: 'api_link_start', lineUserId, estimateId });
        
        const res = await fetch('/api/link', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lineUserId, estimateId })
        });
        
        const resData = await res.json();
        log('main', { step: 'api_link_response', status: res.status, ok: res.ok, data: resData });
        
        if (!res.ok) {
          throw new Error(resData.error || `サーバーエラー (${res.status})`);
        }
        
        showMessage('完了！チャットを開きます...');
        log('main', { step: 'success' });
        
        setTimeout(() => {
          window.location.href = 'https://line.me/R/oaMessage/@602epmvz/';
        }, 500);
        
      } catch (error) {
        console.error('LIFF Error:', error);
        log('main', { step: 'error', message: error.message, stack: error.stack });
        showMessage(error.message || 'エラーが発生しました', true);
      }
    }
    
    document.addEventListener('DOMContentLoaded', main);
  </script>
</body>
</html>
