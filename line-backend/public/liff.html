<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE連携</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .container {
      text-align: center;
      padding: 20px;
      max-width: 320px;
    }
    .loading {
      width: 40px;
      height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #00B900;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .message {
      color: #666;
      font-size: 14px;
    }
    .error {
      color: #ff5252;
    }
    .retry-button {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 24px;
      background: #00B900;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }
    .retry-button:hover {
      background: #009D00;
    }
    #debug {
      font-size: 11px;
      white-space: pre-wrap;
      padding: 10px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-top: 20px;
      max-width: 300px;
      text-align: left;
      word-break: break-all;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="loading" id="spinner"></div>
    <p id="message" class="message">処理中...</p>
    <div id="actions" style="display:none;"></div>
  </div>
  <div id="debug"></div>

  <script>
    function debug(msg, obj) {
      const el = document.getElementById('debug');
      const line = obj ? msg + ' ' + JSON.stringify(obj) : msg;
      el.textContent += line + "\n";
      console.log('[LIFF]', msg, obj || '');
    }
    
    window.addEventListener('error', (e) => debug('window.error', { message: e.message }));
    window.addEventListener('unhandledrejection', (e) => debug('promise.reject', { reason: String(e.reason) }));
    
    function showMessage(text, isError = false) {
      const el = document.getElementById('message');
      el.textContent = text;
      if (isError) {
        el.classList.add('error');
        document.getElementById('spinner').style.display = 'none';
      }
    }
    
    function showRetryButton(text, url) {
      const actionsEl = document.getElementById('actions');
      actionsEl.style.display = 'block';
      actionsEl.innerHTML = `<a href="${url}" class="retry-button">${text}</a>`;
    }
    
    // estimateIdを取得（URL or liff.state）
    function getEstimateId() {
      const urlParams = new URLSearchParams(window.location.search);
      
      // 1. 通常のクエリパラメータから取得
      let estimateId = urlParams.get('estimateId');
      if (estimateId) {
        debug('estimateId from query', { estimateId });
        return estimateId;
      }
      
      // 2. liff.stateから取得（ログイン後リダイレクト時）
      const liffState = urlParams.get('liff.state');
      if (liffState) {
        debug('liff.state found', { raw: liffState });
        try {
          const decoded = decodeURIComponent(liffState);
          debug('liff.state decoded', { decoded });
          const match = decoded.match(/estimateId=([^&]+)/);
          if (match) {
            estimateId = match[1];
            debug('estimateId from liff.state', { estimateId });
            return estimateId;
          }
        } catch (e) {
          debug('liff.state parse error', { error: e.message });
        }
      }
      
      debug('estimateId not found');
      return null;
    }
    
    async function main() {
      debug('start');
      debug('url', { href: window.location.href });
      
      try {
        // LIFF設定を取得
        showMessage('設定を読み込み中...');
        debug('fetch /api/liff-config');
        const configRes = await fetch('/api/liff-config');
        if (!configRes.ok) {
          throw new Error('LIFF設定の取得に失敗しました');
        }
        const config = await configRes.json();
        const liffId = config.liffId;
        debug('liff-config ok', { liffId });
        
        if (!liffId) {
          throw new Error('LIFF IDが設定されていません');
        }
        
        // LIFF初期化
        showMessage('LIFFを初期化中...');
        debug('liff.init start', { liffId });
        await liff.init({ liffId });
        debug('liff.init ok');
        
        // estimateIdを取得
        const estimateId = getEstimateId();
        debug('estimateId result', { estimateId });
        
        if (!estimateId) {
          showMessage('見積もりIDが見つかりません。フォームからやり直してください。', true);
          showRetryButton('見積もりフォームへ戻る', '/');
          return;
        }
        
        // ログイン確認
        debug('isLoggedIn', { value: liff.isLoggedIn() });
        if (!liff.isLoggedIn()) {
          showMessage('LINEログイン中...');
          debug('not logged in -> liff.login');
          liff.login();
          return;
        }
        
        debug('logged in');
        
        // プロフィール取得
        showMessage('プロフィール取得中...');
        debug('getProfile start');
        const profile = await liff.getProfile();
        const lineUserId = profile.userId;
        debug('profile ok', { userId: lineUserId, displayName: profile.displayName });
        
        // APIに送信
        showMessage('見積もりを送信中...');
        debug('POST /api/link start', { lineUserId, estimateId });
        
        const res = await fetch('/api/link', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lineUserId, estimateId })
        });
        
        const resText = await res.text();
        debug('POST /api/link done', { status: res.status, text: resText });
        
        if (!res.ok) {
          if (res.status === 404) {
            showMessage('見積もりの有効期限が切れました。もう一度お見積もりをお願いします。', true);
            showRetryButton('見積もりフォームへ戻る', '/');
            return;
          }
          throw new Error(resText || 'サーバーエラーが発生しました');
        }
        
        debug('success!');
        showMessage('完了！チャットを開きます...');
        setTimeout(() => {
          debug('redirect to LINE chat');
          window.location.href = 'https://line.me/R/oaMessage/@602epmvz/';
        }, 1000);
        
      } catch (error) {
        debug('error', { message: error.message, stack: error.stack });
        showMessage(error.message || 'エラーが発生しました', true);
        showRetryButton('見積もりフォームへ戻る', '/');
      }
    }
    
    document.addEventListener('DOMContentLoaded', main);
  </script>
</body>
</html>
