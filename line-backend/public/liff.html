<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE連携</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .container {
      text-align: center;
      padding: 20px;
      max-width: 320px;
    }
    .loading {
      width: 40px;
      height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #00B900;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .message {
      color: #666;
      font-size: 14px;
    }
    .error {
      color: #ff5252;
    }
    .retry-button {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 24px;
      background: #00B900;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }
    .retry-button:hover {
      background: #009D00;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="loading" id="spinner"></div>
    <p id="message" class="message">処理中...</p>
    <div id="actions" style="display:none;"></div>
  </div>

  <script>
    function log(step, data = {}) {
      console.log(`[LIFF] ${step}:`, data);
    }
    
    function showMessage(text, isError = false) {
      const el = document.getElementById('message');
      el.textContent = text;
      if (isError) {
        el.classList.add('error');
        document.getElementById('spinner').style.display = 'none';
      }
    }
    
    function showRetryButton(text, url) {
      const actionsEl = document.getElementById('actions');
      actionsEl.style.display = 'block';
      actionsEl.innerHTML = `<a href="${url}" class="retry-button">${text}</a>`;
    }
    
    // estimateIdを取得（URL or liff.state）
    function getEstimateId() {
      const urlParams = new URLSearchParams(window.location.search);
      
      // 1. 通常のクエリパラメータから取得
      let estimateId = urlParams.get('estimateId');
      if (estimateId) {
        log('getEstimateId', { source: 'query', estimateId });
        return estimateId;
      }
      
      // 2. liff.stateから取得（ログイン後リダイレクト時）
      const liffState = urlParams.get('liff.state');
      if (liffState) {
        log('getEstimateId', { source: 'liff.state', raw: liffState });
        try {
          const decoded = decodeURIComponent(liffState);
          const match = decoded.match(/estimateId=([^&]+)/);
          if (match) {
            estimateId = match[1];
            log('getEstimateId', { source: 'liff.state.parsed', estimateId });
            return estimateId;
          }
        } catch (e) {
          log('getEstimateId', { error: 'parse_failed' });
        }
      }
      
      return null;
    }
    
    async function main() {
      try {
        log('main', { step: 'start', url: window.location.href });
        
        // LIFF設定を取得
        showMessage('設定を読み込み中...');
        const configRes = await fetch('/api/liff-config');
        if (!configRes.ok) {
          throw new Error('LIFF設定の取得に失敗しました');
        }
        const config = await configRes.json();
        const liffId = config.liffId;
        log('main', { step: 'config', liffId });
        
        if (!liffId) {
          throw new Error('LIFF IDが設定されていません');
        }
        
        // LIFF初期化
        showMessage('LIFFを初期化中...');
        await liff.init({ liffId });
        log('main', { step: 'init_done', isLoggedIn: liff.isLoggedIn() });
        
        // estimateIdを取得
        const estimateId = getEstimateId();
        log('main', { step: 'estimateId', estimateId });
        
        if (!estimateId) {
          showMessage('見積もりIDが見つかりません。フォームからやり直してください。', true);
          showRetryButton('見積もりフォームへ戻る', '/');
          return;
        }
        
        // ログイン確認
        if (!liff.isLoggedIn()) {
          showMessage('LINEログイン中...');
          log('main', { step: 'login_redirect' });
          liff.login();
          return;
        }
        
        // プロフィール取得
        showMessage('プロフィール取得中...');
        const profile = await liff.getProfile();
        const lineUserId = profile.userId;
        log('main', { step: 'profile', lineUserId });
        
        // APIに送信
        showMessage('見積もりを送信中...');
        const res = await fetch('/api/link', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lineUserId, estimateId })
        });
        
        const resData = await res.json();
        log('main', { step: 'api_response', status: res.status, data: resData });
        
        if (!res.ok) {
          if (res.status === 404) {
            showMessage('見積もりの有効期限が切れました。もう一度お見積もりをお願いします。', true);
            showRetryButton('見積もりフォームへ戻る', '/');
            return;
          }
          throw new Error(resData.error || 'サーバーエラーが発生しました');
        }
        
        showMessage('完了！チャットを開きます...');
        setTimeout(() => {
          window.location.href = 'https://line.me/R/oaMessage/@602epmvz/';
        }, 500);
        
      } catch (error) {
        console.error('LIFF Error:', error);
        showMessage(error.message || 'エラーが発生しました', true);
        showRetryButton('見積もりフォームへ戻る', '/');
      }
    }
    
    document.addEventListener('DOMContentLoaded', main);
  </script>
</body>
</html>
