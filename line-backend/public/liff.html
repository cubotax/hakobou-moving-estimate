<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE連携</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .container {
      text-align: center;
      padding: 20px;
    }
    .loading {
      width: 40px;
      height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #00B900;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .message {
      color: #666;
      font-size: 14px;
    }
    .error {
      color: #ff5252;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="loading"></div>
    <p id="message" class="message">処理中...</p>
  </div>

  <script>
    const LIFF_ID = '2008810460-IvjGbCbG';
    
    function showMessage(text, isError) {
      const el = document.getElementById('message');
      el.textContent = text;
      if (isError) el.classList.add('error');
    }
    
    function getEstimateData() {
      // 1. URLパラメータから取得
      const urlParams = new URLSearchParams(window.location.search);
      const dataFromUrl = urlParams.get('data');
      if (dataFromUrl) return dataFromUrl;
      
      // 2. liff.stateから取得（ログイン後のリダイレクト）
      try {
        const state = liff.state;
        if (state) return state;
      } catch (e) {}
      
      return null;
    }
    
    async function main() {
      try {
        showMessage('LIFFを初期化中...');
        await liff.init({ liffId: LIFF_ID });
        
        // データを取得（URLまたはstate）
        let estimateDataEncoded = getEstimateData();
        
        if (!liff.isLoggedIn()) {
          // データをstateに渡してログイン
          const urlParams = new URLSearchParams(window.location.search);
          const dataForState = urlParams.get('data') || '';
          showMessage('LINEログイン中...');
          liff.login({ redirectUri: window.location.origin + window.location.pathname + '?liff.state=' + encodeURIComponent(dataForState) });
          return;
        }
        
        showMessage('プロフィール取得中...');
        const profile = await liff.getProfile();
        const lineUserId = profile.userId;
        
        if (!estimateDataEncoded) {
          showMessage('見積もりデータが見つかりません', true);
          return;
        }
        
        let estimate;
        try {
          const decoded = decodeURIComponent(atob(estimateDataEncoded));
          estimate = JSON.parse(decoded);
        } catch (e) {
          console.error('Parse error:', e);
          showMessage('見積もりデータの解析に失敗しました', true);
          return;
        }
        
        showMessage('見積もりを送信中...');
        const res = await fetch('/api/link', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lineUserId, estimate })
        });
        
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'サーバーエラー');
        }
        
        showMessage('完了！チャットを開きます...');
        
        setTimeout(() => {
          window.location.href = 'https://line.me/R/oaMessage/@602epmvz/';
        }, 500);
        
      } catch (error) {
        console.error('Error:', error);
        showMessage(error.message || 'エラーが発生しました', true);
      }
    }
    
    document.addEventListener('DOMContentLoaded', main);
  </script>
</body>
</html>
