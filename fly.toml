# fly.toml app configuration file for hakobou-mitsumori

app = "hakobou-mitsumori"
primary_region = "nrt"

[build]

[http_service]
  internal_port = 3000
  force_https = true

  # ▼ ここが重要
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 1

  processes = ["app"]

[[vm]]
  cpus = 1
  memory = "1gb"
  memory_mb = 1024

[mounts]
  source = "db_data"
  destination = "/data"
  processes = ["app"]
