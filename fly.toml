# fly.toml app configuration file generated for hakobou-mitsumori

app = 'hakobou-mitsumori'
primary_region = 'nrt'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[mounts]
  source = "db_data"
  destination = "/data"
  processes = ["app"]  # ← ここを追加しました